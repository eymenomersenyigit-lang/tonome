insmod all_video
insmod gfxterm
insmod gfxmenu
insmod jpeg
insmod png

terminal_input console
terminal_output gfxterm

set default="0"
set timeout="30"

menuentry "Boot to[no]ME! Linux (loopback)" {
  linux /boot/vmlinuz-linux archisobasedir=tonome archiso_loop_mnt=/run/archiso/bootmnt earlymodules=loop
  initrd /boot/initramfs-linux.img
}

menuentry "Boot to[no]ME! Linux (Fallback)" {
  linux /boot/vmlinuz-linux archisobasedir=tonome archiso_loop_mnt=/run/archiso/bootmnt earlymodules=loop
  initrd /boot/initramfs-linux-fallback.img
}
