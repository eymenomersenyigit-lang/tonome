insmod all_video
insmod gfxterm
insmod gfxmenu
insmod jpeg
insmod png

terminal_input console
terminal_output gfxterm

set default="0"
set timeout="30"

menuentry "Boot to[no]ME! Linux (loopback)" {
  linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
  initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Boot to[no]ME! Linux (Fallback)" {
  linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
  initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-fallback.img
}
