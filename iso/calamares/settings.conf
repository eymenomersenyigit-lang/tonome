# to[no]ME! Calamares Settings
---
modules-search: [/usr/lib/calamares/modules, /lib/calamares/modules]
sequence:
- show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
- exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksopenswaphookcfg
    - luksbootkeyfile
    - plymouthcfg
    - initcpiocfg
    - initramfs
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - grubcfg
    - bootloader
    - postcfg
    - umount
