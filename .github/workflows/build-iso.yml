name: Build to[no]ME! Linux ISO

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'ISO version tag'
        required: false
        default: 'nightly'

env:
  DOTNET_VERSION: '9.0.x'
  BUILD_CONFIG: 'Release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build all projects
        run: dotnet build --configuration ${{ env.BUILD_CONFIG }} --no-restore

      - name: Run tests
        run: dotnet test --configuration ${{ env.BUILD_CONFIG }} --no-build --verbosity normal || echo "No tests found"

      - name: Publish for Linux x64
        run: |
          mkdir -p build/framework build/compositor build/shell build/settings build/session build/boot build/installer
          dotnet publish src/Tonome.Framework \
            -c ${{ env.BUILD_CONFIG }} -r linux-x64 --self-contained true \
            -o build/framework
          dotnet publish src/Tonome.Compositor \
            -c ${{ env.BUILD_CONFIG }} -r linux-x64 --self-contained true \
            -o build/compositor
          dotnet publish src/Tonome.Shell \
            -c ${{ env.BUILD_CONFIG }} -r linux-x64 --self-contained true \
            -o build/shell
          dotnet publish src/Tonome.Settings \
            -c ${{ env.BUILD_CONFIG }} -r linux-x64 --self-contained true \
            -o build/settings
          dotnet publish src/Tonome.Session \
            -c ${{ env.BUILD_CONFIG }} -r linux-x64 --self-contained true \
            -o build/session
          dotnet publish src/Tonome.Boot \
            -c ${{ env.BUILD_CONFIG }} -r linux-x64 --self-contained true \
            -o build/boot
          dotnet publish src/Tonome.Installer \
            -c ${{ env.BUILD_CONFIG }} -r linux-x64 --self-contained true \
            -o build/installer

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tonome-desktop-${{ github.sha }}
          path: build/
          retention-days: 7

  build-iso:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm archiso git base-devel dotnet-sdk-9.0 grub syslinux

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tonome-desktop-${{ github.sha }}
          path: build/

      - name: Build Arch Linux packages
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          # Create local repo directory
          mkdir -p /repo/tonome/x86_64

          # Helper: create a .pkg.tar.zst from a directory
          create_package() {
            local pkgname="$1" pkgver="$2" pkgrel="$3" pkgdesc="$4"
            local pkgdir="/tmp/pkg/$pkgname"
            mkdir -p "$pkgdir"
            shift 4
            # Copy paths passed as remaining arguments (src -> dst pairs)
            local args=("$@")
            for ((i=0; i<${#args[@]}; i+=2)); do
              local src="${args[i]}" dst="${args[i+1]}"
              mkdir -p "$(dirname "$pkgdir$dst")"
              cp -r "$src" "$pkgdir$dst"
            done

            # Generate .PKGINFO
            local size=$({ du -sb "$pkgdir" 2>/dev/null || stat --printf='%s' "$pkgdir"; } | awk '{print $1}')
            printf 'pkgname = %s\npkgver = %s-%s\npkgdesc = %s\nurl = https://github.com/eymenomersenyigit-lang/tonome\nbuilddate = %d\npackager = Tonome CI\nsize = %s\narch = x86_64\nlicense = GPL3\n' \
              "$pkgname" "$pkgver" "$pkgrel" "$pkgdesc" "$(date +%s)" "$size" \
              > "$pkgdir/.PKGINFO"

            # Create .INSTALL script if exists
            if [ -f "${pkgdir}.install" ]; then
              mv "${pkgdir}.install" "$pkgdir/.INSTALL"
            fi

            # Create the archive (archive contents, not the wrapping dir)
            cd "$pkgdir"
            tar --zstd -cf "/repo/tonome/x86_64/$pkgname-$pkgver-$pkgrel-x86_64.pkg.tar.zst" \
              --owner=0 --group=0 .
            cd /tmp
            rm -rf "$pkgdir"
            cd "$GITHUB_WORKSPACE"
          }

          # --- Package: tonome-desktop ---
          create_package "tonome-desktop" "0.1.0" "1" "Tonome Desktop core framework" \
            "build/framework" "/usr/lib/tonome/framework" \
            "build/compositor" "/usr/lib/tonome/compositor" \
            "build/shell" "/usr/lib/tonome/shell" \
            "build/settings" "/usr/lib/tonome/settings"

          # --- Package: tonome-session (with launcher) ---
          session_pkg="/tmp/pkg/tonome-session"
          rm -rf "$session_pkg"
          mkdir -p "$session_pkg/usr/lib/tonome/session"
          cp -r build/session/* "$session_pkg/usr/lib/tonome/session/"
          mkdir -p "$session_pkg/usr/bin"
          printf '#!/bin/bash\nexport XDG_SESSION_TYPE=wayland\nexport XDG_SESSION_DESKTOP=tonome\nexport XDG_CURRENT_DESKTOP=to[no]ME!\nexport GTK_USE_PORTAL=1\nexec /usr/lib/tonome/session/Tonome.Session "$@"\n' \
            > "$session_pkg/usr/bin/tonome-session"
          chmod +x "$session_pkg/usr/bin/tonome-session"
          mkdir -p "$session_pkg/usr/share/wayland-sessions"
          printf '[Desktop Entry]\nName=to[no]ME!\nComment=Tonome Desktop Session\nExec=/usr/bin/tonome-session\nType=Application\n' \
            > "$session_pkg/usr/share/wayland-sessions/tonome.desktop"
          session_size=$({ du -sb "$session_pkg" 2>/dev/null || stat --printf='%s' "$session_pkg"; } | awk '{print $1}')
          printf 'pkgname = tonome-session\npkgver = 0.1.0-1\npkgdesc = Tonome Desktop session manager\nurl = https://github.com/eymenomersenyigit-lang/tonome\nbuilddate = %d\npackager = Tonome CI\nsize = %s\narch = x86_64\nlicense = GPL3\ndepend = tonome-desktop\n' \
            "$(date +%s)" "$session_size" \
            > "$session_pkg/.PKGINFO"
          cd "$session_pkg"
          tar --zstd -cf "/repo/tonome/x86_64/tonome-session-0.1.0-1-x86_64.pkg.tar.zst" \
            --owner=0 --group=0 .
          cd /tmp
          rm -rf "$session_pkg"

          # Initialize repo database
          cd /repo/tonome/x86_64
          repo-add tonome.db.tar.gz *.pkg.tar.zst
          cd "$GITHUB_WORKSPACE"

      - name: Build ISO
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          # Replace linux-tonome with stock linux kernel for CI
          # (the real linux-tonome kernel is too heavy to build in CI)
          sed -i 's/^linux-tonome/linux/' iso/archiso/packages.x86_64
          sed -i '/^linux$/a nvidia-dkms' iso/archiso/packages.x86_64
          echo "Packages for ISO:"
          cat iso/archiso/packages.x86_64
          mkarchiso -v -w /work -o /output iso/archiso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: tonome-linux-iso-${{ github.sha }}
          path: /output/*.iso
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-iso
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: tonome-linux-iso-${{ github.sha }}
          path: iso-download

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.sha }}
          name: "to[no]ME! Linux Nightly Build"
          body: |
            ## to[no]ME! Linux Nightly Build
            
            Automated build from commit ${{ github.sha }}
            
            **Date:** $(date -u +'%Y-%m-%d %H:%M UTC')
            
            ### What's included:
            - Tonome Desktop (C#/.NET 9)
            - Wayland Compositor
            - Custom Linux kernel with gaming/HDR optimizations
            - Wine/Proton pre-installed
            
            **Test in a VM:** Boot the ISO in VirtualBox or QEMU
          files: iso-download/*.iso
          prerelease: true
